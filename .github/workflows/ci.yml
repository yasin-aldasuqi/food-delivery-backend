name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: # allow manual runs from the Actions tab

# Least privilege: this workflow only needs to read the code.
permissions:
  contents: read

# A newer push to the same branch/PR cancels the run that is still in progress.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build-and-test:
    name: Build & test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'dotnet-tools.json') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restore
        run: |
          dotnet restore
          dotnet tool restore

      # `dotnet list package --vulnerable` exits 0 even when it finds something,
      # so the output has to be checked explicitly.
      - name: Check for vulnerable packages
        run: |
          dotnet list package --vulnerable --include-transitive | tee vulnerable.txt
          if grep -q "has the following vulnerable packages" vulnerable.txt; then
            echo "::error::Vulnerable NuGet packages found (see the list above)."
            exit 1
          fi

      - name: Build (warnings are errors)
        run: dotnet build --no-restore --configuration Release -warnaserror

      # Fails when an entity/configuration changed but no migration was added.
      - name: Check for missing EF Core migrations
        run: >
          dotnet ef migrations has-pending-model-changes
          --project src/FoodDelivery.Api
          --configuration Release
          --no-build

      # Docker is available on GitHub-hosted Ubuntu runners,
      # so Testcontainers starts a real PostgreSQL for the integration tests.
      - name: Test
        run: >
          dotnet test
          --no-build
          --configuration Release
          --logger "trx;LogFileName=test-results.trx"
          --results-directory TestResults

      - name: Upload test results
        if: always() # most useful exactly when tests fail
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults
          if-no-files-found: ignore
