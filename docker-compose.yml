services:
  db:
    image: postgres:16
    container_name: fooddelivery-db
    environment:
      POSTGRES_USER: fooddelivery
      POSTGRES_PASSWORD: dev_password_123
      POSTGRES_DB: fooddelivery
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
